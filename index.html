<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>経理丸ごとAI</title>
    <meta
      name="description"
      content="税理士事務所向けに、記帳完了後のレビュー・差戻し・進捗管理・顧問先連絡をAIで支援するSaaS。"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script>
      // Supabase session init — runs before script.js.
      // Exposes window.__sessionPromise (resolves to session or null) and window.__bookmeeSignOut.
      (function () {
        const SUPABASE_URL = 'https://kmgjmlcijhgaqddtjdou.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImttZ2ptbGNpamhnYXFkZHRqZG91Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3MDI0MDEsImV4cCI6MjA5NTI3ODQwMX0.oX5bfJ-FRb6LWFmzR479IqPtx3sU_ZWaDtX_S41-EtU';
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // localhost では Supabase 認証をバイパス（DEV_BYPASS_AUTH と対になる）
        var isLocalDev = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        if (isLocalDev) {
          var devSession = { user: { id: 'dev-user', email: 'dev@localhost' }, access_token: 'dev-token' };
          window.__bookmeeSession = devSession;
          window.__sessionPromise = Promise.resolve(devSession);
        } else {
          window.__sessionPromise = sb.auth.getSession().then(function (result) {
            var session = result.data && result.data.session;
            if (!session) {
              window.location.href = '/login.html?redirect=' + encodeURIComponent(location.pathname + location.search + location.hash);
              return null;
            }
            window.__bookmeeSession = session;
            sb.auth.onAuthStateChange(function (event, s) {
              if (!s) { window.location.href = '/login.html'; }
              else { window.__bookmeeSession = s; }
            });
            return session;
          });
        }

        window.__bookmeeSignOut = function () {
          return sb.auth.signOut().then(function () {
            window.location.href = '/login.html';
          });
        };
      })();
    </script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#">
          <span class="brand-mark">経</span>
          <span>
            <strong>経理丸ごとAI</strong>
            <small>for 税理士事務所</small>
          </span>
        </a>

        <nav class="main-nav" aria-label="メイン">
          <p class="nav-group-label">今日</p>
          <button class="nav-item active" data-view="dashboard">ToDo</button>

          <p class="nav-group-label">業務</p>
          <button class="nav-item" data-view="company">顧問先</button>
          <button class="nav-item nav-parent" data-view-group="jobs">
            月次業務 <span class="nav-caret">▾</span>
          </button>
          <div class="nav-sub" id="jobsSub">
            <button class="nav-item nav-sub-item" data-view="jobs-journal">仕訳</button>
            <button class="nav-item nav-sub-item" data-view="jobs-vouchers">証憑</button>
            <button class="nav-item nav-sub-item" data-view="jobs-monthly-check">月次チェック</button>
          </div>
          <button class="nav-item" data-view="vouchers-register">証憑登録</button>
          <button class="nav-item" data-view="matching-results">突合結果</button>
          <button class="nav-item" data-view="portal">メッセージ</button>

          <p class="nav-group-label">連携</p>
          <button class="nav-item" data-view="integrations-drive">Google Drive</button>
          <button class="nav-item" data-view="integrations-line">LINE</button>

          <p class="nav-group-label">学習・設定</p>
          <button class="nav-item" data-view="rules">学習</button>
          <button class="nav-item" data-view="settings">設定</button>
        </nav>

        <div class="nav-user-info" id="navUserInfo"></div>
        <button class="nav-logout" id="logoutButton">ログアウト</button>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow">2026年5月 月次レビュー</p>
            <h1 id="topbarTitle">
              <span class="mode-toggle" id="modeToggle">
                <button class="mode-btn active" data-mode="monthly">月次</button>
                <button class="mode-btn" data-mode="yearend">期末</button>
              </span>
            </h1>
          </div>
          <div class="topbar-actions">
            <label class="search-box">
              <span>検索</span>
              <input id="searchInput" type="search" placeholder="顧問先・担当者・確認事項を検索" />
            </label>
            <select id="roleSelector" class="role-selector">
              <option value="tax_accountant">税理士として見る</option>
              <option value="staff">スタッフとして見る</option>
            </select>
          </div>
        </header>

        <section class="client-chips" aria-label="顧問先フィルタ" id="clientChips"></section>

        <section class="summary-grid" id="summaryGrid">
          <article class="summary-card">
            <span>レビュー完了率</span>
            <strong id="progressValue">—</strong>
            <div class="progress"><i id="progressBar"></i></div>
          </article>
          <article class="summary-card">
            <span>所長確認待ち</span>
            <strong id="openTaskValue">—</strong>
            <small>高優先度 <b id="riskValue">—</b> 件</small>
          </article>
          <article class="summary-card">
            <span>証憑回収率</span>
            <strong id="receiptValue">—</strong>
            <small>不足 <b id="missingValue">—</b> 件</small>
          </article>
          <article class="summary-card">
            <span>差戻し中</span>
            <strong id="diffValue">—</strong>
            <small>自動作成 <b id="matchValue">—</b> 件</small>
          </article>
          <article class="summary-card">
            <span id="vendorSyncLabel">ベンダー横断同期</span>
            <strong id="vendorSyncValue">—</strong>
            <small id="vendorSyncDetail">freee と MF の取り込み OK 率</small>
          </article>
        </section>

        <section class="main-panel">
          <div class="panel-header">
            <div>
              <p class="eyebrow" id="currentViewLabel">ToDo</p>
              <h2 id="panelTitle">—</h2>
            </div>
            <div class="segmented" role="tablist" aria-label="表示切替">
              <button class="segment active" data-filter="all">すべて</button>
              <button class="segment" data-filter="urgent">要確認</button>
              <button class="segment" data-filter="done">完了</button>
            </div>
          </div>

          <div id="viewContent"></div>
        </section>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./script.js"></script>
  </body>
</html>
