<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>パスワードをお忘れですか — Bookmee</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f5f5f5; font-family: sans-serif; }
    .box { background: #fff; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,.1); padding: 2rem; width: 360px; }
    .box h1 { font-size: 1.3rem; margin-bottom: .5rem; }
    .box p { font-size: .9rem; color: #666; margin-bottom: 1.5rem; }
    label { display: block; font-size: .85rem; margin-bottom: .25rem; color: #555; }
    input[type=email] { width: 100%; padding: .6rem .75rem; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; box-sizing: border-box; margin-bottom: 1rem; }
    .btn { width: 100%; padding: .75rem; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; }
    .btn:hover { background: #1d4ed8; }
    .btn:disabled { background: #93c5fd; cursor: default; }
    .back-link { display: block; text-align: center; margin-top: 1rem; font-size: .85rem; color: #2563eb; text-decoration: none; }
    .back-link:hover { text-decoration: underline; }
    .error { color: #dc2626; font-size: .85rem; margin-bottom: .75rem; display: none; }
    .sent { text-align: center; display: none; }
    .sent p { color: #16a34a; font-size: .95rem; }
    .sent small { color: #666; font-size: .8rem; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Bookmee</h1>
    <div id="formSection">
      <p>登録済みのメールアドレスを入力してください。パスワード再設定リンクをお送りします。</p>
      <div id="error" class="error"></div>
      <label for="email">メールアドレス</label>
      <input id="email" type="email" placeholder="you@example.com" autocomplete="email" />
      <button id="btn" class="btn">リンクを送信</button>
      <a href="/login.html" class="back-link">ログインに戻る</a>
    </div>
    <div id="sentSection" class="sent">
      <p>メールを送信しました</p>
      <small>受信ボックスを確認してください。メールが届かない場合は迷惑メールフォルダもご確認ください。</small>
      <a href="/login.html" class="back-link" style="margin-top:1.5rem">ログインに戻る</a>
    </div>
  </div>

  <script type="module">
    import { supabase } from '/auth-shared.js';

    const errorEl = document.getElementById('error');
    const btn = document.getElementById('btn');

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.style.display = 'block';
    }

    btn.addEventListener('click', async () => {
      errorEl.style.display = 'none';
      const email = document.getElementById('email').value.trim();
      if (!email) return showError('メールアドレスを入力してください');

      btn.disabled = true;
      btn.textContent = '送信中…';

      const { error } = await supabase.auth.resetPasswordForEmail(email, {
        redirectTo: `${location.origin}/auth/set-password.html`,
      });

      if (error) {
        btn.disabled = false;
        btn.textContent = 'リンクを送信';
        return showError(error.message);
      }

      document.getElementById('formSection').style.display = 'none';
      document.getElementById('sentSection').style.display = 'block';
    });

    document.getElementById('email').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') btn.click();
    });
  </script>
</body>
</html>
