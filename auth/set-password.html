<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>パスワード設定 — Bookmee</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f5f5f5; font-family: sans-serif; }
    .box { background: #fff; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,.1); padding: 2rem; width: 360px; }
    .box h1 { font-size: 1.3rem; margin-bottom: .5rem; }
    .box p { font-size: .9rem; color: #666; margin-bottom: 1.5rem; }
    label { display: block; font-size: .85rem; margin-bottom: .25rem; color: #555; }
    input[type=password] { width: 100%; padding: .6rem .75rem; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; box-sizing: border-box; margin-bottom: 1rem; }
    .btn { width: 100%; padding: .75rem; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; }
    .btn:hover { background: #1d4ed8; }
    .btn:disabled { background: #93c5fd; cursor: default; }
    .error { color: #dc2626; font-size: .85rem; margin-bottom: .75rem; display: none; }
    .success { color: #16a34a; font-size: .9rem; text-align: center; display: none; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Bookmee</h1>
    <p id="subtitle">パスワードを設定してください</p>
    <div id="error" class="error"></div>
    <div id="success" class="success"></div>
    <div id="form">
      <label for="password">新しいパスワード</label>
      <input id="password" type="password" placeholder="8文字以上" autocomplete="new-password" />
      <label for="confirm">確認（再入力）</label>
      <input id="confirm" type="password" placeholder="同じパスワードを入力" autocomplete="new-password" />
      <button id="btn" class="btn">設定して開始</button>
    </div>
  </div>

  <script type="module">
    const SUPABASE_URL = 'https://kmgjmlcijhgaqddtjdou.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImttZ2ptbGNpamhnYXFkZHRqZG91Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3MDI0MDEsImV4cCI6MjA5NTI3ODQwMX0.oX5bfJ-FRb6LWFmzR479IqPtx3sU_ZWaDtX_S41-EtU';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Supabase v2 automatically exchanges the URL fragment tokens on getSession().
    const { data: { session } } = await supabase.auth.getSession();

    const errorEl = document.getElementById('error');
    const successEl = document.getElementById('success');
    const formEl = document.getElementById('form');

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.style.display = 'block';
    }

    if (!session) {
      formEl.style.display = 'none';
      showError('リンクの有効期限が切れているか、無効なリンクです。ログインページからやり直してください。');
    }

    // Adjust subtitle based on token type (invite vs recovery)
    const hash = location.hash;
    if (hash.includes('type=recovery')) {
      document.getElementById('subtitle').textContent = '新しいパスワードを入力してください';
    }

    document.getElementById('btn').addEventListener('click', async () => {
      errorEl.style.display = 'none';
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;

      if (password.length < 8) return showError('パスワードは8文字以上で入力してください');
      if (password !== confirm) return showError('パスワードが一致しません');

      const btn = document.getElementById('btn');
      btn.disabled = true;
      btn.textContent = '設定中…';

      const { error } = await supabase.auth.updateUser({ password });
      if (error) {
        btn.disabled = false;
        btn.textContent = '設定して開始';
        return showError(error.message);
      }

      formEl.style.display = 'none';
      successEl.style.display = 'block';
      successEl.textContent = 'パスワードを設定しました。アプリに移動します…';
      setTimeout(() => { window.location.href = '/'; }, 1500);
    });
  </script>
</body>
</html>
