services:
  postgres:
    image: postgres:16-alpine
    container_name: zeimee-postgres
    environment:
      POSTGRES_USER: zeimee
      POSTGRES_PASSWORD: zeimee_dev
      POSTGRES_DB: zeimee
    ports:
      - "5432:5432"
    volumes:
      - zeimee_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeimee -d zeimee"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  zeimee_pg_data:
